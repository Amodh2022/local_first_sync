# Static analysis configuration. Run with `dart analyze`.
#
# `package:lints/recommended.yaml` is the Dart team's recommended rule set —
# the pure-Dart equivalent of the `flutter_lints` this package used while it
# was still a Flutter package.
include: package:lints/recommended.yaml

analyzer:
  exclude:
    # The example is a separate package with its own analysis_options.yaml.
    - example/**
