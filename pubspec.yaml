name: local_first_sync
description: >-
  Local-first sync for Dart and Flutter: offline writes, a crash-safe queue,
  dependency-ordered operations, temp-id rewriting, and pluggable conflict
  resolution.
version: 0.1.0
topics:
  - offline-first
  - local-first
  - sync
  - offline
  - storage

environment:
  sdk: ^3.5.0

# No runtime dependencies. The core is plain Dart: storage, networking,
# connectivity and state management are all yours to plug in.

dev_dependencies:
  lints: ^4.0.0
  test: ^1.26.0
